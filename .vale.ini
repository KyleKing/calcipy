StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.27.2/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells
# Fires on every `**Label:** Sentence` bullet, which is this repo's docs convention rather than a tell.
ai-tells.ColonUsage = NO

# Vale walks the whole tree regardless of .gitignore, so vendored Markdown needs its styles cleared.
[{.nox,.venv,node_modules}/**/*.md]
BasedOnStyles =
